name: Build and Send AAR to Telegram

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Build language-textmate AAR
        run: ./gradlew :language-textmate:assembleRelease

      - name: Send to Telegram
        run: |
          curl -F document=@language-textmate/build/outputs/aar/language-textmate-release.aar \
               -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"

name: Build and Send AAR to Telegram

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Build AAR
        run: ./gradlew :language-textmate:assembleRelease --stacktrace --info > build.log 2>&1 || true

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: language-textmate-release.aar
          path: language-textmate/build/outputs/aar/language-textmate-release.aar

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Send AAR to Telegram
        if: success()
        run: |
          curl -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F document=@language-textmate/build/outputs/aar/language-textmate-release.aar \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"

      - name: Send error to Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
               -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
               --data-urlencode "text=❌ Build failed for \`${{ github.repository }}\`%0ACommit: \`${{ github.sha }}\`%0A\n$(tail -n 30 build.log | sed 's/$/%0A/' | head -c 3500)"
